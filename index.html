<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#214f37">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Junior Golf</title>
<style>
:root{--bg:#f4f6f2;--card:#fff;--text:#172019;--muted:#6b756d;--line:#dfe5df;--green:#214f37;--soft:#e9f2ec;--warn:#f7efe3;--red:#963d38}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.app{max-width:760px;margin:auto;padding:12px 10px 80px}.top h1{margin:4px 0 0;font-size:27px}.top p{margin:4px 0;color:var(--muted)}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 7px 22px rgba(30,50,35,.06)}
.grid2,.summary{display:grid;grid-template-columns:1fr 1fr;gap:9px}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}select,input,button{font:inherit;border:1px solid var(--line);border-radius:12px;background:white;color:var(--text)}
select,input{width:100%;padding:12px}button{cursor:pointer}.primary{background:var(--green);color:#fff;border-color:var(--green);padding:13px 16px;font-weight:850}.secondary{padding:10px 13px;font-weight:750}.danger{padding:10px 13px;font-weight:800;color:var(--red);border-color:#d7aaa7}.hidden{display:none!important}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tab{padding:12px;font-weight:850}.tab.active{background:var(--green);color:#fff;border-color:var(--green)}
.par-grid{display:grid;grid-template-columns:repeat(9,1fr);gap:6px}.par-cell{text-align:center}.par-cell label{font-size:10px;margin-bottom:3px}.par-cell input{text-align:center;padding:9px 2px;font-weight:800}
.hole-nav{display:grid;grid-template-columns:48px 1fr 48px;gap:8px;align-items:center}.hole-title{text-align:center;font-size:19px;font-weight:850}
.cat{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}.cat:first-child{border-top:0;margin-top:0;padding-top:0}.catname{font-weight:850;font-size:18px}
.maincounter{display:grid;grid-template-columns:54px 1fr 54px;gap:8px;margin-top:9px}.maincounter button,.errline button{font-size:23px;font-weight:900;background:var(--soft)}.maincounter .num{font-size:25px;font-weight:900;text-align:center;padding:9px;border:1px solid var(--line);border-radius:12px;background:#fff}
.errgrid{display:grid;grid-template-columns:1fr;gap:8px;margin-top:10px}.err{background:var(--warn);padding:10px;border-radius:13px}.errline{display:grid;grid-template-columns:1fr 48px 72px 48px;gap:7px;align-items:center}.errlabel{font-size:16px;font-weight:750}.errcount{font-size:24px;font-weight:900;text-align:center;background:#fff;border:1px solid var(--line);border-radius:11px;padding:8px 2px}
.scorebar{background:var(--soft);border-radius:14px;padding:13px;margin-top:14px;display:flex;justify-content:space-between;align-items:center}.big{font-size:27px;font-weight:900}.mini{font-size:12px;color:var(--muted)}
.stat{border:1px solid var(--line);border-radius:13px;padding:11px}.stat .v{font-size:22px;font-weight:850}.stat .k{font-size:11px;color:var(--muted)}
.history{border-top:1px solid var(--line);padding:12px 0}.history:first-child{border-top:0}.history.selected{background:var(--soft);padding:12px;border-radius:13px}.roundActions{display:flex;gap:8px;margin-top:9px}.viewRound{background:var(--green);color:#fff;border-color:var(--green);padding:10px 14px;font-weight:850}

@media(max-width:520px){.grid2{grid-template-columns:1fr}.par-grid{grid-template-columns:repeat(5,1fr)}.app{padding:9px 7px 70px}}
</style>
</head>
<body>
<div class="app">
<div class="top"><h1>Junior Golf</h1><p>Juniorin S · Junior I</p></div>
<div class="card"><div class="tabs"><button id="tabStart" class="tab active">Neue Runde</button><button id="tabStats" class="tab">Statistik</button></div></div>

<section id="startView">
<div class="card"><h2 style="margin-top:0">Neue Runde</h2>
<div class="grid2"><div><label>Junior</label><select id="startPlayer"><option>Juniorin S</option><option>Junior I</option></select></div><div><label>Anzahl Löcher</label><select id="startHoles"><option value="9">9 Loch</option><option value="18">18 Loch</option></select></div></div>
<div style="margin-top:12px"><label>Platz</label><select id="courseSelect"><option value="bubikon">Bubikon</option><option value="zuerichsee">Zürichsee</option><option value="laegern">Lägern</option><option value="kyburg">Kyburg</option><option value="hittnau">Hittnau</option><option value="custom">Eigener Platz …</option></select></div>
<div id="customNameWrap" class="hidden" style="margin-top:12px"><label>Name eigener Platz</label><input id="customName" placeholder="z. B. Golfclub Muster"></div>
<div style="margin-top:14px"><div class="row" style="justify-content:space-between"><strong>Par pro Loch</strong><span class="mini">editierbar</span></div><div id="parGrid" class="par-grid" style="margin-top:8px"></div><div class="row" style="justify-content:space-between;margin-top:10px"><span class="mini">Gesamt-Par</span><strong id="setupParTotal">0</strong></div></div>
<button id="startRoundBtn" class="primary" style="width:100%;margin-top:16px">Runde starten</button></div>
</section>

<section id="roundView" class="hidden">
<div class="card"><div class="row" style="justify-content:space-between"><div><div id="roundPlayer" class="mini"></div><strong id="roundCourse"></strong></div><button id="backToStart" class="secondary">← Start</button></div></div>
<div class="card"><div class="hole-nav"><button id="prevHole" class="secondary">←</button><div class="hole-title">Loch <span id="holeNum"></span> · Par <span id="holePar"></span></div><button id="nextHole" class="secondary">→</button></div><div id="entry"></div>
<div class="scorebar"><span><strong id="holeResult">Par</strong><br><span class="mini">Score Loch</span></span><span class="big" id="holeScore">0</span></div></div>
<div class="card"><div class="row" style="justify-content:space-between"><div><div class="mini">Runde</div><div class="big"><span id="roundScore">0</span> Schläge</div><div class="mini">Par <span id="roundPar">0</span> · <span id="roundRel">0</span></div></div><button id="saveRoundBtn" class="primary">Runde speichern</button></div></div>
</section>

<section id="statsView" class="hidden">
<div class="card"><h2 style="margin-top:0">Statistik</h2><label>Junior</label><select id="statsPlayer"><option>Juniorin S</option><option>Junior I</option></select></div>
<div class="card"><strong>Rundenübersicht</strong><div id="roundOverview" class="summary" style="margin-top:10px"></div></div>
<div class="card"><div class="row" style="justify-content:space-between"><strong>Ausgewählte Runde</strong><span id="selectedRoundLabel" class="mini"></span></div><div id="latest" class="summary" style="margin-top:10px"></div></div>
<div class="card"><strong>Gesamtstatistik</strong><div id="overallResults" class="summary" style="margin-top:10px"></div></div>
<div class="card"><strong>Gespeicherte Runden</strong><div id="historyList" style="margin-top:8px"></div></div>
<div class="card"><strong>Datensicherung</strong><div class="mini" style="margin-top:5px">Die Rundendaten bleiben lokal im Browser.</div><div class="row" style="margin-top:10px"><button id="exportBtn" class="secondary">Exportieren</button><label class="secondary" style="margin:0;cursor:pointer">Importieren<input id="importFile" type="file" accept=".json" style="display:none"></label></div></div>
</section>
</div>
<script>
const STORE="juniorGolfPWA1";
const courses={
bubikon:{name:"Bubikon",pars:[4,4,3,4,4,4,3,3,4,4,4,3,4,4,4,3,3,4]},
zuerichsee:{name:"Zürichsee",pars:[4,3,4,5,4,3,4,5,4,5,4,4,4,4,3,5,4,4]},
laegern:{name:"Lägern",pars:[4,4,5,3,5,4,4,4,3,4,5,4,4,3,5,4,4,3]},
kyburg:{name:"Kyburg",pars:[4,5,4,3,4,5,4,3,5,4,3,4,4,3,5,3,4,4]},
hittnau:{name:"Hittnau",pars:[4,3,5,4,4,3,5,4,4,5,4,4,3,4,3,4,4,5]}
};
const $=id=>document.getElementById(id);
let db=load(),current=null,currentHole=0,selectedRoundIndex=null;
function load(){try{return JSON.parse(localStorage.getItem(STORE))||{rounds:[]}}catch(e){return{rounds:[]}}}
function persist(){localStorage.setItem(STORE,JSON.stringify(db))}
function blankHole(par){return{par,tee:{shots:0,left:0,right:0,topped:0},short:{shots:0,left:0,right:0,topped:0},putts:0,penalties:0}}
function score(h){return h.tee.shots+h.short.shots+h.putts+h.penalties}
function sum(r){return r.holes.reduce((a,h)=>{a.score+=score(h);a.par+=h.par;a.tee+=h.tee.shots;a.short+=h.short.shots;a.putts+=h.putts;a.pen+=h.penalties;a.left+=h.tee.left+h.short.left;a.right+=h.tee.right+h.short.right;a.top+=h.tee.topped+h.short.topped;return a},{score:0,par:0,tee:0,short:0,putts:0,pen:0,left:0,right:0,top:0})}
function rel(v){return(v>0?"+":"")+v}
function classifyHole(h){const sc=score(h);if(sc===0)return"Nicht gespielt";const d=sc-h.par;if(d<=-2)return"Eagle oder besser";if(d===-1)return"Birdie";if(d===0)return"Par";if(d===1)return"Bogey";if(d===2)return"Doppelbogey";return"Triplebogey+"}
function resultCounts(rounds){const c={eagle:0,birdie:0,par:0,bogey:0,double:0,triple:0};rounds.forEach(r=>r.holes.forEach(h=>{const x=classifyHole(h);if(x==="Nicht gespielt")return;if(x==="Eagle oder besser")c.eagle++;else if(x==="Birdie")c.birdie++;else if(x==="Par")c.par++;else if(x==="Bogey")c.bogey++;else if(x==="Doppelbogey")c.double++;else c.triple++}));return c}
function puttCounts(rounds){const c={one:0,two:0,more:0};rounds.forEach(r=>r.holes.forEach(h=>{if(h.putts===1)c.one++;else if(h.putts===2)c.two++;else if(h.putts>2)c.more++}));return c}
function totalSum(rounds){return rounds.reduce((a,r)=>{const s=sum(r);Object.keys(a).forEach(k=>a[k]+=s[k]);return a},{score:0,par:0,tee:0,short:0,putts:0,pen:0,left:0,right:0,top:0})}
function box(k,v){return`<div class="stat"><div class="k">${k}</div><div class="v">${v}</div></div>`}
function statHTML(rounds){const a=totalSum(rounds),r=resultCounts(rounds),p=puttCounts(rounds);return box("Score",a.score)+box("Par",a.par)+box("Zu Par",rel(a.score-a.par))+box("Eagle oder besser",r.eagle)+box("Birdies",r.birdie)+box("Pars",r.par)+box("Bogeys",r.bogey)+box("Doppelbogeys",r.double)+box("Triplebogey+",r.triple)+box("1-Putt",p.one)+box("2-Putt",p.two)+box("> 2 Putts",p.more)+box("Tee → Grün",a.tee)+box("Kurze Schläge",a.short)+box("Putts",a.putts)+box("Strafschläge",a.pen)+box("Links / Rechts / Top",`${a.left} / ${a.right} / ${a.top}`)}
function show(id){["startView","roundView","statsView"].forEach(x=>$(x).classList.add("hidden"));$(id).classList.remove("hidden");$("tabStart").classList.toggle("active",id==="startView");$("tabStats").classList.toggle("active",id==="statsView")}
function setupPars(){const n=+$("startHoles").value,key=$("courseSelect").value;let pars=key==="custom"?Array(n).fill(4):courses[key].pars.slice(0,n);$("parGrid").innerHTML=pars.map((p,i)=>`<div class="par-cell"><label>${i+1}</label><input class="parInput" type="number" min="2" max="7" value="${p}"></div>`).join("");document.querySelectorAll(".parInput").forEach(x=>x.oninput=calcSetupPar);calcSetupPar()}
function calcSetupPar(){$("setupParTotal").textContent=[...document.querySelectorAll(".parInput")].reduce((a,x)=>a+(+x.value||0),0)}
$("courseSelect").onchange=()=>{$("customNameWrap").classList.toggle("hidden",$("courseSelect").value!=="custom");setupPars()};
$("startHoles").onchange=setupPars;
$("startRoundBtn").onclick=()=>{const pars=[...document.querySelectorAll(".parInput")].map(x=>Math.max(2,Math.min(7,+x.value||4))),key=$("courseSelect").value,name=key==="custom"?($("customName").value.trim()||"Eigener Platz"):courses[key].name;current={player:$("startPlayer").value,course:name,date:new Date().toISOString(),holes:pars.map(blankHole)};currentHole=0;renderRound();show("roundView")};
function mainCounter(path,label,val){return`<div class="cat"><div class="catname">${label}</div><div class="maincounter"><button data-op="minus" data-key="${path}">−</button><div class="num">${val}</div><button data-op="plus" data-key="${path}">+</button></div></div>`}
function err(sec,k,label,v){return`<div class="err"><div class="errline"><div class="errlabel">${label}</div><button data-op="minus" data-key="${sec}.${k}">−</button><div class="errcount">${v}</div><button data-op="plus" data-key="${sec}.${k}">+</button></div></div>`}
function shotSection(key,label,o){return`<div class="cat"><div class="catname">${label}</div><div class="maincounter"><button data-op="minus" data-key="${key}.shots">−</button><div class="num">${o.shots}</div><button data-op="plus" data-key="${key}.shots">+</button></div><div class="errgrid">${err(key,"left","⬅️ Links",o.left)}${err(key,"right","➡️ Rechts",o.right)}${err(key,"topped","⬆️ Getoppt",o.topped)}</div></div>`}
function getPath(o,p){return p.split(".").reduce((x,k)=>x[k],o)}function setPath(o,p,v){const a=p.split("."),k=a.pop(),t=a.reduce((x,q)=>x[q],o);t[k]=Math.max(0,v)}
function renderRound(){const h=current.holes[currentHole],s=sum(current);$("roundPlayer").textContent=current.player;$("roundCourse").textContent=current.course;$("holeNum").textContent=currentHole+1;$("holePar").textContent=h.par;$("entry").innerHTML=shotSection("tee","🏌️ Tee → Grün",h.tee)+shotSection("short","⛳ Kurze Schläge",h.short)+mainCounter("putts","🟢 Putts",h.putts)+mainCounter("penalties","⚠️ Strafschläge",h.penalties);$("holeScore").textContent=score(h);$("holeResult").textContent=score(h)===0?"Noch keine Schläge":classifyHole(h);$("roundScore").textContent=s.score;$("roundPar").textContent=s.par;$("roundRel").textContent=rel(s.score-s.par)+" zu Par";$("prevHole").disabled=currentHole===0;$("nextHole").disabled=currentHole===current.holes.length-1;document.querySelectorAll("[data-op]").forEach(b=>b.onclick=()=>{const v=getPath(h,b.dataset.key);setPath(h,b.dataset.key,b.dataset.op==="plus"?v+1:v-1);renderRound()})}
$("prevHole").onclick=()=>{if(currentHole){currentHole--;renderRound()}};$("nextHole").onclick=()=>{if(currentHole<current.holes.length-1){currentHole++;renderRound()}};
$("backToStart").onclick=()=>{if(confirm("Zur Startseite zurück? Nicht gespeicherte Eingaben gehen verloren.")){current=null;show("startView")}};
$("saveRoundBtn").onclick=()=>{if(!current)return;const saved=current;db.rounds.push(saved);persist();$("statsPlayer").value=saved.player;selectedRoundIndex=db.rounds.length-1;current=null;renderStats();show("statsView")};
function renderStats(){const p=$("statsPlayer").value,indexed=db.rounds.map((r,i)=>({r,i})).filter(x=>x.r.player===p),rs=indexed.map(x=>x.r);$("roundOverview").innerHTML=box("Gespielte Runden",rs.length)+box("Gespielte Löcher",rs.reduce((a,r)=>a+r.holes.length,0))+box("9-Loch-Runden",rs.filter(r=>r.holes.length===9).length)+box("18-Loch-Runden",rs.filter(r=>r.holes.length===18).length);if(!rs.length){selectedRoundIndex=null;$("selectedRoundLabel").textContent="";$("latest").innerHTML='<div class="mini">Noch keine Runde gespeichert.</div>';$("overallResults").innerHTML='<div class="mini">Noch keine Daten.</div>';$("historyList").innerHTML='<div class="mini">Noch keine Daten.</div>';return}if(selectedRoundIndex===null||!indexed.some(x=>x.i===selectedRoundIndex))selectedRoundIndex=indexed[indexed.length-1].i;const sel=db.rounds[selectedRoundIndex];$("selectedRoundLabel").textContent=`${sel.course} · ${new Date(sel.date).toLocaleDateString("de-CH")}`;$("latest").innerHTML=statHTML([sel]);$("overallResults").innerHTML=statHTML(rs);$("historyList").innerHTML=indexed.slice().reverse().map(({r,i})=>{const s=sum(r),selected=i===selectedRoundIndex;return`<div class="history ${selected?"selected":""}"><strong>${r.course} · ${r.holes.length} Loch · Score ${s.score} (${rel(s.score-s.par)})</strong><div class="mini">${new Date(r.date).toLocaleDateString("de-CH")} · Tee→Grün ${s.tee} · Kurz ${s.short} · Putts ${s.putts} · Strafen ${s.pen}</div><div class="roundActions"><button class="viewRound" data-view="${i}">${selected?"✓ Angezeigt":"Ansehen"}</button><button class="danger" data-delete="${i}">Löschen</button></div></div>`}).join("");document.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>{selectedRoundIndex=+b.dataset.view;renderStats();$("selectedRoundLabel").scrollIntoView({behavior:"smooth",block:"center"})});document.querySelectorAll("[data-delete]").forEach(b=>b.onclick=()=>{const i=+b.dataset.delete,r=db.rounds[i];if(confirm(`${r.course} vom ${new Date(r.date).toLocaleDateString("de-CH")} wirklich löschen?`)){db.rounds.splice(i,1);persist();selectedRoundIndex=null;renderStats()}})}
$("tabStart").onclick=()=>show("startView");$("tabStats").onclick=()=>{renderStats();show("statsView")};$("statsPlayer").onchange=()=>{selectedRoundIndex=null;renderStats()};
$("exportBtn").onclick=()=>{const blob=new Blob([JSON.stringify(db,null,2)],{type:"application/json"}),u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download="junior-golf-daten.json";a.click();URL.revokeObjectURL(u)};
$("importFile").onchange=async()=>{try{const f=$("importFile").files[0];if(!f)return;const x=JSON.parse(await f.text());if(!Array.isArray(x.rounds))throw 0;if(confirm("Lokale Daten durch Import ersetzen?")){db=x;persist();selectedRoundIndex=null;renderStats()}}catch(e){alert("Ungültige Datei.")}$("importFile").value=""};
setupPars();
if("serviceWorker"in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js?v=11").catch(()=>{}));
</script></body></html>
